<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a phone-first day planner — a 21-day strip on top, the chosen day's drops below, tab bar at the bottom. */
:root{
  --bg:#fff4f2; --surface:#ffffff; --sunk:#fde6e3; --line:#f4cdc8;
  --fg:#2b1418; --muted:#8a5960;
  --accent:#e8436f; --accent-2:#f97316; --accent-ink:#ffffff; --accent-soft:#fde0e7;
  --song:#c2410c; --song-bg:#ffe6d5;
  --story:#be185d; --story-bg:#fce1ee;
  --rec:#c81e1e; --rec-bg:#fde3e3; --ok:#15803d; --ok-bg:#dcf3e3;
  --display:"Bricolage Grotesque","Be Vietnam Pro",system-ui,sans-serif;
  --body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1c1013; --surface:#28171b; --sunk:#221316; --line:#46262d;
  --fg:#fbeaec; --muted:#c79aa2; --accent:#ff7a9c; --accent-2:#fb923c; --accent-ink:#1c1013; --accent-soft:#3d1f28;
  --song:#fb923c; --song-bg:#3b2112; --story:#f472b6; --story-bg:#3b1729;
  --rec:#ff6b6b; --rec-bg:#3d1717; --ok:#4ade80; --ok-bg:#163222; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1c1013; --surface:#28171b; --sunk:#221316; --line:#46262d;
  --fg:#fbeaec; --muted:#c79aa2; --accent:#ff7a9c; --accent-2:#fb923c; --accent-ink:#1c1013; --accent-soft:#3d1f28;
  --song:#fb923c; --song-bg:#3b2112; --story:#f472b6; --story-bg:#3b1729;
  --rec:#ff6b6b; --rec-bg:#3d1717; --ok:#4ade80; --ok-bg:#163222; color-scheme:dark}

body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-block:0 calc(110px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:16px}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);padding-block:14px 10px;display:flex;flex-direction:column;gap:12px}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:7px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent-2)}
h1{font-family:var(--display);font-weight:800;font-size:24px;line-height:1.1;margin:3px 0 0;letter-spacing:-.02em}
.overall{text-align:right;font-size:12.5px;color:var(--muted);line-height:1.3}
.overall b{display:block;font-family:var(--display);font-size:22px;color:var(--fg);font-variant-numeric:tabular-nums}
.obar{height:5px;border-radius:9px;background:var(--sunk);overflow:hidden}
.obar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2))}

/* 21-day strip */
.days{display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:4px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:0 0 auto;width:52px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 0 7px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;scroll-snap-align:center;position:relative}
.day small{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.day b{font-family:var(--display);font-size:18px;line-height:1.1;font-variant-numeric:tabular-nums}
.day .ring{width:24px;height:24px}
.day.today{border-color:var(--accent)}
.day[aria-pressed="true"]{background:linear-gradient(160deg,var(--accent),var(--accent-2));border-color:transparent;color:var(--accent-ink)}
.day[aria-pressed="true"] small{color:var(--accent-ink);opacity:.8}
.day .flag{position:absolute;top:4px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--rec)}
.day.empty-day b{opacity:.55}

/* day view */
.dhead{display:flex;flex-direction:column;gap:6px}
.dhead h2{font-family:var(--display);font-size:22px;margin:0;text-wrap:balance}
.deadline{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.deadline .cd{font-family:var(--display);font-weight:700;font-size:18px}
.deadline .cd.late{color:var(--rec)} .deadline .cd.done{color:var(--ok)}
.deadline span{font-size:13px;color:var(--muted)}
.deadline span b{color:var(--fg);font-family:var(--mono);font-weight:600}
.deadline .bx{flex-basis:100%;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.deadline .bx strong{font-family:var(--mono);font-size:20px;color:var(--fg)}
.deadline .vn{font-family:var(--mono);font-size:12.5px;background:var(--sunk);border-radius:6px;padding:2px 7px;color:var(--muted)}
.wfoot .vn{background:var(--sunk);border-radius:5px;padding:0 5px}
details.popup{border:1px dashed var(--line);border-radius:12px;padding:10px 12px;font-size:14px}
details.popup summary{cursor:pointer;font-weight:600;color:var(--muted);font-size:13px}
details.popup p{margin:8px 0 0;font-style:italic}
.sec{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:6px 0 -4px}
.sec.warn{color:var(--rec)}
.nothing{border:1px dashed var(--line);border-radius:12px;padding:18px;text-align:center;color:var(--muted);font-size:14px}

.work{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.work.complete{border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.wtop{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px}
.chip.song{background:var(--song-bg);color:var(--song)}
.chip.story{background:var(--story-bg);color:var(--story)}
.chip.late{background:var(--rec-bg);color:var(--rec)}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.file{font-family:var(--mono);font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.edit{margin-left:auto;border:0;background:transparent;color:var(--accent);font-size:13px;font-weight:600;cursor:pointer;padding:4px 6px}
.work h3{margin:0;font-size:16.5px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.work .note{margin:0;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:6px}
.step{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px;cursor:pointer;text-align:left;min-width:0}
.step .box{flex:0 0 20px;height:20px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:700;color:transparent}
.step .lab{display:flex;flex-direction:column;min-width:0;font-size:13.5px;font-weight:600;line-height:1.25}
.step .lab small{font-family:var(--mono);font-weight:400;font-size:10.5px;color:var(--muted)}
.step[aria-pressed="true"]{background:var(--ok-bg);border-color:transparent}
.step[aria-pressed="true"] .box{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.step[aria-pressed="true"] .lab{color:var(--ok)}
.step:disabled{opacity:.6}
.wfoot{display:flex;justify-content:space-between;gap:8px;font-family:var(--mono);font-size:11.5px;color:var(--muted);flex-wrap:wrap}

/* list view */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.seg{display:inline-flex;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:7px;cursor:pointer;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);font-weight:600}
.tog{display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--muted);cursor:pointer}
.tog input{accent-color:var(--accent);width:17px;height:17px}
.group{display:flex;flex-direction:column;gap:6px}
.group h3{font-family:var(--display);font-size:15px;margin:8px 0 0;display:flex;justify-content:space-between;gap:8px}
.group h3 small{font-family:var(--mono);font-size:11.5px;color:var(--muted);font-weight:400}
.row{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:10px 12px;cursor:pointer;text-align:left;width:100%;min-width:0}
.row .t{flex:1;min-width:0;display:flex;flex-direction:column}
.row .t b{font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .t small{font-size:12px;color:var(--muted)}
.pips{display:flex;gap:3px;flex:0 0 auto}
.pips i{width:9px;height:9px;border-radius:3px;background:var(--sunk);border:1px solid var(--line)}
.pips i.on{background:var(--ok);border-color:var(--ok)}

.status{font-size:12.5px;color:var(--muted);text-align:center}

/* bottom tab bar + fab */
.nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.nav button{border:0;background:transparent;padding:9px 4px;border-radius:12px;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px}
.nav button[aria-current="true"]{color:var(--accent);background:var(--accent-soft)}
.nav svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media (min-width:761px){.nav{left:50%;right:auto;transform:translateX(-50%);width:400px;bottom:14px;border:1px solid var(--line);border-radius:16px;padding:6px}}

/* sheet */
.overlay{position:fixed;inset:0;background:rgb(10 8 18/.45);display:flex;justify-content:center;align-items:flex-end;z-index:20}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:22px 22px 0 0;max-height:92vh;overflow-y:auto;display:flex;flex-direction:column;gap:12px;
  padding:12px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
.sheet::before{content:"";width:40px;height:5px;border-radius:9px;background:var(--line);align-self:center}
@media (min-width:761px){.overlay{align-items:center}.sheet{border-radius:18px;padding:20px}.sheet::before{display:none}}
.sheet h2{font-family:var(--display);margin:0;font-size:21px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;font-size:16px}
.field textarea{min-height:70px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:12.5px;color:var(--muted);margin:-4px 0 0}
.btn{border:0;border-radius:11px;padding:12px 18px;font-weight:600;cursor:pointer;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.danger{background:var(--rec);color:#fff}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.actions .r{display:flex;gap:10px;margin-left:auto}
.err{color:var(--rec);font-size:13px;margin:0}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .2s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}}
</style>

<div class="wrap">
  <header>
    <div class="hrow">
      <div>
        <div class="eyebrow"><span class="dot"></span>App P99 · giờ Bỉ</div>
        <h1>Sổ Tiến Độ</h1>
      </div>
      <div class="overall"><b id="oCount">0/0</b><span id="oLeft">việc đã xong</span></div>
    </div>
    <div class="obar"><i id="oBar" style="width:0%"></i></div>
    <div class="days" id="days" role="group" aria-label="Chọn ngày"></div>
  </header>

  <main id="view"></main>
  <p class="status" id="status">Đang tải lịch…</p>
</div>

<nav class="nav" aria-label="Màn hình">
  <button type="button" data-tab="day" aria-current="true"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Theo ngày</button>
  <button type="button" data-tab="list" aria-current="false"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Tất cả</button>
</nav>

<div class="overlay" id="overlay" hidden>
  <form class="sheet" id="form" autocomplete="off">
    <h2 id="fHead">Sửa</h2>
    <div class="field"><label for="fTitle">Tên</label><input id="fTitle" required maxlength="160"></div>
    <div class="two">
      <div class="field"><label for="fFile">Tên file</label><input id="fFile" maxlength="80"></div>
      <div class="field"><label for="fKind">Loại</label><select id="fKind"><option value="song">Bài hát</option><option value="story">Truyện</option></select></div>
    </div>
    <div class="two">
      <div class="field"><label for="fDate">Ngày hạn (giờ Bỉ)</label><input type="date" id="fDate" min="2026-10-31" max="2026-11-30" required></div>
      <div class="field"><label for="fTime">Giờ hạn (giờ Bỉ)</label><input type="time" id="fTime" required></div>
    </div>
    <p class="hint" id="fLocal"></p>
    <div class="field"><label for="fNote">Ghi chú</label><textarea id="fNote" maxlength="2000"></textarea></div>
    <p class="err" id="err" hidden></p>
    <div class="actions">
      <button type="button" class="btn ghost" id="delBtn">Xoá</button>
      <div class="r"><button type="button" class="btn ghost" id="cancelBtn">Huỷ</button><button type="submit" class="btn" id="saveBtn">Lưu</button></div>
    </div>
  </form>
</div>

<script>
const START="2026-11-02", END="2026-11-22";
const STEPS={
  song:[["write","Viết bài"],["chord","Sửa hoà thanh"],["record","Thu âm"],["video","Làm video"],["upload","Upload"]],
  story:[["write","Viết truyện"],["record","Thu âm"],["upload","Upload"]]
};
const WD=["CN","T2","T3","T4","T5","T6","T7"];
let works=[], days={}, tab="day", sel=null, kindF="all", hideDone=false, db=null, editing=null, delArmed=false, loaded=false;
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* time: records store the Vietnam release time (UTC+7); everything is shown in Belgian time, VN beside it */
const BX="Europe/Brussels", VN="Asia/Ho_Chi_Minh";
function parts(dt,tz){
  const p={};new Intl.DateTimeFormat("en-CA",{timeZone:tz,year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"})
    .formatToParts(dt).forEach(x=>p[x.type]=x.value);
  return{date:`${p.year}-${p.month}-${p.day}`,time:`${p.hour}:${p.minute}`};
}
const dl=w=>new Date(`${w.date}T${w.time||"23:59"}:00+07:00`);
const bDate=w=>parts(dl(w),BX).date;
const bxToday=()=>parts(new Date(),BX).date;
function fromBx(d,t){ /* Belgian wall time -> instant */
  const guess=new Date(`${d}T${t}:00Z`), p=parts(guess,BX);
  return new Date(guess.getTime()-(new Date(`${p.date}T${p.time}:00Z`)-guess));
}
const dParts=s=>{const d=new Date(s+"T00:00:00Z");return{wd:WD[d.getUTCDay()],d:d.getUTCDate(),m:d.getUTCMonth()+1}};
const dLabel=s=>{const p=dParts(s);return`${p.d}/${p.m}`};
const at=(dt,tz)=>{const p=parts(dt,tz);return`${p.time} ${dLabel(p.date)}`};
const atBx=dt=>at(dt,BX), atVn=dt=>at(dt,VN);
function span(a,b){const r=[];let d=new Date(a+"T00:00:00Z");const e=new Date(b+"T00:00:00Z");while(d<=e){r.push(d.toISOString().slice(0,10));d=new Date(d.getTime()+864e5)}return r}

const stepsOf=w=>STEPS[w.kind]||STEPS.song;
const doneN=w=>stepsOf(w).filter(([k])=>w.steps?.[k]).length;
const isDone=w=>doneN(w)===stepsOf(w).length;
const isLate=w=>!isDone(w)&&dl(w)<new Date();
const byDl=(a,b)=>dl(a)-dl(b)||(a.order||0)-(b.order||0);
function title(w){return w.kind==="story"&&w.parts>1?`${w.title} — phần ${w.part}/${w.parts}`:w.title}
function sideLbl(w){return w.kind==="story"?(w.parts>1?`Truyện · ${w.part}/${w.parts}`:"Truyện"):("Bài hát"+(w.side?` · ${w.side}`:""))}
function left(ms){
  const a=Math.abs(ms),d=Math.floor(a/864e5),h=Math.floor(a%864e5/36e5),m=Math.floor(a%36e5/6e4);
  return d?`${d} ngày ${h} giờ`:h?`${h} giờ ${m} phút`:`${m} phút`;
}
function ring(done,total,onAccent){
  const r=9,c=2*Math.PI*r,p=total?done/total:0;
  const col=onAccent?"currentColor":(p===1?"var(--ok)":"var(--accent)");
  return`<svg class="ring" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="${r}" fill="none" stroke="${onAccent?"currentColor":"var(--line)"}" stroke-opacity="${onAccent?.3:1}" stroke-width="3"/>${total?`<circle cx="12" cy="12" r="${r}" fill="none" stroke="${col}" stroke-width="3" stroke-linecap="round" stroke-dasharray="${c*p} ${c}" transform="rotate(-90 12 12)"/>`:""}</svg>`;
}
function dayRange(){
  const ds=works.map(bDate);
  const a=[START,...ds].sort()[0], b=[END,...ds].sort().pop();
  return span(a,b);
}

/* ---------- render ---------- */
function render(){
  const total=works.reduce((a,w)=>a+stepsOf(w).length,0), done=works.reduce((a,w)=>a+doneN(w),0);
  $("oCount").textContent=`${done}/${total}`;
  $("oBar").style.width=total?(done/total*100)+"%":"0%";
  const last=works.length?works.reduce((m,w)=>dl(w)>m?dl(w):m,new Date(0)):new Date(END+"T23:11:00+07:00");
  $("oLeft").textContent=`việc xong · còn ${Math.max(0,Math.ceil((last-new Date())/864e5))} ngày`;
  const today=bxToday();
  $("days").innerHTML=dayRange().map(d=>{
    const ws=works.filter(w=>bDate(w)===d), t=ws.reduce((a,w)=>a+stepsOf(w).length,0), n=ws.reduce((a,w)=>a+doneN(w),0);
    const on=d===sel, p=dParts(d);
    return`<button type="button" class="day${d===today?" today":""}${ws.length?"":" empty-day"}" data-day="${d}" aria-pressed="${on}" aria-label="Ngày ${p.d}/${p.m}, ${n}/${t} việc">
      ${ws.some(isLate)?'<span class="flag"></span>':""}<small>${p.wd}</small><b>${p.d}</b>${ring(n,t,on)}</button>`}).join("");
  document.querySelectorAll(".nav button").forEach(b=>b.setAttribute("aria-current",b.dataset.tab===tab));
  $("view").innerHTML=tab==="day"?dayView():listView();
}

function card(w){
  const late=isLate(w), comp=isDone(w), due=dl(w);
  return`<article class="work${comp?" complete":""}" data-id="${esc(w.id)}">
    <div class="wtop"><span class="chip ${w.kind}">${esc(sideLbl(w))}</span>${late?'<span class="chip late">Quá hạn</span>':comp?'<span class="chip ok">Xong</span>':""}
      ${w.file?`<span class="file">${esc(w.file)}</span>`:""}<button type="button" class="edit" data-edit="${esc(w.id)}">Sửa</button></div>
    <h3>${esc(title(w))}</h3>
    ${w.note?`<p class="note">${esc(w.note)}</p>`:""}
    <div class="steps">${stepsOf(w).map(([k,l],i)=>{const t=w.steps?.[k];
      return`<button type="button" class="step" data-w="${esc(w.id)}" data-k="${k}" aria-pressed="${!!t}"><span class="box">✓</span><span class="lab">${i+1}. ${l}<small>${t?"xong "+atBx(new Date(t)):"chưa xong"}</small></span></button>`}).join("")}</div>
    <div class="wfoot"><span>${doneN(w)}/${stepsOf(w).length} bước</span><span>hạn <b>${atBx(due)}</b> Bỉ · <span class="vn">${atVn(due)} VN</span></span></div>
  </article>`;
}

function dayView(){
  const ws=works.filter(w=>bDate(w)===sel).sort(byDl);
  const p=dParts(sel);
  let h=`<section class="dhead"><h2>${p.wd==="CN"?"Chủ nhật":"Thứ "+p.wd.slice(1)}, ${p.d}/${p.m}</h2>`;
  const dls=[...new Set(ws.map(w=>dl(w).getTime()))];
  for(const ts of dls){
    const due=new Date(ts), group=ws.filter(w=>dl(w).getTime()===ts), ms=due-new Date(), all=group.every(isDone);
    const cd=all?`<span class="cd done">Đã xong hết</span>`:ms>0?`<span class="cd">Còn ${left(ms)}</span>`:`<span class="cd late">Quá hạn ${left(ms)}</span>`;
    h+=`<div class="deadline"><div class="bx"><span>Hạn</span><strong>${parts(due,BX).time}</strong><span>giờ Bỉ</span><span class="vn">= ${atVn(due)} giờ VN</span></div>${cd}</div>`;
  }
  for(const vd of [...new Set(ws.map(w=>w.date))]){
    const info=days[vd];
    if(info?.popup)h+=`<details class="popup"><summary>Pop-up message${info.time?" · "+esc(info.time)+" VN":""}</summary><p>${esc(info.popup)}</p></details>`;
  }
  h+=`</section>`;
  h+=ws.length?ws.map(card).join(""):`<div class="nothing">Ngày ${p.d}/${p.m} không có hạn nào. Tranh thủ làm trước cho ngày sau nhé.</div>`;
  const late=works.filter(w=>bDate(w)<sel&&isLate(w)).sort(byDl);
  if(late.length)h+=`<p class="sec warn">Ngày trước chưa xong (${late.length})</p>`+late.map(card).join("");
  const next=works.filter(w=>bDate(w)>sel&&!isDone(w)).sort(byDl).slice(0,3);
  if(next.length)h+=`<p class="sec">Sắp tới, có thể làm trước</p>`+next.map(card).join("");
  return h;
}

function listView(){
  let ws=works.filter(w=>(kindF==="all"||w.kind===kindF)&&(!hideDone||!isDone(w)));
  let h=`<div class="filters"><div class="seg" role="group" aria-label="Lọc loại">
    ${[["all","Tất cả"],["song","Bài hát"],["story","Truyện"]].map(([k,l])=>`<button type="button" data-kf="${k}" aria-pressed="${kindF===k}">${l}</button>`).join("")}</div>
    <label class="tog"><input type="checkbox" id="hideDone" ${hideDone?"checked":""}> Ẩn việc đã xong</label></div>`;
  const dates=[...new Set(ws.map(bDate))].sort();
  if(!dates.length)h+=`<div class="nothing">${works.length?"Không còn gì cần làm ở mục này.":"Chưa có lịch."}</div>`;
  for(const d of dates){
    const g=ws.filter(w=>bDate(w)===d).sort(byDl), p=dParts(d), due=dl(g[0]);
    h+=`<section class="group"><h3>${p.wd} ${p.d}/${p.m}<small>hạn ${parts(due,BX).time} Bỉ · ${atVn(due)} VN</small></h3>`+g.map(w=>`
      <button type="button" class="row" data-go="${esc(w.id)}"><span class="chip ${w.kind}">${w.kind==="song"?"♪":"✎"}</span>
        <span class="t"><b>${esc(title(w))}</b><small>${esc(sideLbl(w))}${isLate(w)?" · quá hạn":""}</small></span>
        <span class="pips">${stepsOf(w).map(([k])=>`<i class="${w.steps?.[k]?"on":""}"></i>`).join("")}</span></button>`).join("")+`</section>`;
  }
  return h;
}

/* ---------- interactions ---------- */
$("days").addEventListener("click",e=>{const b=e.target.closest(".day");if(!b)return;sel=b.dataset.day;tab="day";render();window.scrollTo({top:0})});
document.querySelector(".nav").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;tab=b.dataset.tab;render();window.scrollTo({top:0})});
$("view").addEventListener("change",e=>{if(e.target.id==="hideDone"){hideDone=e.target.checked;render()}});
$("view").addEventListener("click",async e=>{
  const kf=e.target.closest("[data-kf]");if(kf){kindF=kf.dataset.kf;render();return}
  const go=e.target.closest("[data-go]");if(go){const w=works.find(x=>x.id===go.dataset.go);if(w){sel=bDate(w);tab="day";render();scrollToCard(w.id)}return}
  const ed=e.target.closest("[data-edit]");if(ed){openForm(works.find(x=>x.id===ed.dataset.edit));return}
  const st=e.target.closest(".step");if(!st)return;
  const w=works.find(x=>x.id===st.dataset.w);if(!w)return;
  const k=st.dataset.k, val=w.steps?.[k]?"":new Date().toISOString();
  w.steps={...(w.steps||{}),[k]:val};render();
  try{await write(w.id,{steps:{[k]:val}})}catch(err){flash(errMsg(err))}
});
function scrollToCard(id){requestAnimationFrame(()=>{const el=document.querySelector(`.work[data-id="${CSS.escape(id)}"]`);if(el)el.scrollIntoView({block:"center"})})}

function openForm(w){
  editing=w;delArmed=false;
  $("fHead").textContent="Sửa: "+title(w);
  $("fTitle").value=w.title||"";$("fFile").value=w.file||"";$("fKind").value=w.kind;
  const b=parts(dl(w),BX);$("fDate").value=b.date;$("fTime").value=b.time;$("fNote").value=w.note||"";
  $("delBtn").textContent="Xoá";$("delBtn").className="btn ghost";$("err").hidden=true;
  localHint();$("overlay").hidden=false;
}
function localHint(){
  const d=$("fDate").value,t=$("fTime").value;
  $("fLocal").textContent=d&&t?`= ${atVn(fromBx(d,t))} giờ Việt Nam`:"";
}
$("fDate").oninput=localHint;$("fTime").oninput=localHint;
const closeForm=()=>{$("overlay").hidden=true;editing=null};
$("cancelBtn").onclick=closeForm;
$("overlay").addEventListener("click",e=>{if(e.target===$("overlay"))closeForm()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("overlay").hidden)closeForm()});
$("form").addEventListener("submit",async e=>{
  e.preventDefault();if(!editing)return;
  const v=parts(fromBx($("fDate").value,$("fTime").value),VN);
  const data={title:$("fTitle").value.trim(),file:$("fFile").value.trim(),kind:$("fKind").value,date:v.date,time:v.time,note:$("fNote").value.trim()};
  if(!data.title){$("err").textContent="Hãy nhập tên.";$("err").hidden=false;return}
  const steps={};stepsOf(data).forEach(([k])=>steps[k]=editing.steps?.[k]||"");data.steps=steps;
  $("saveBtn").disabled=true;
  try{await write(editing.id,data);Object.assign(editing,data);sel=bDate(editing);closeForm();render()}
  catch(err){$("err").textContent=errMsg(err);$("err").hidden=false}
  finally{$("saveBtn").disabled=false}
});
$("delBtn").onclick=async()=>{
  if(!delArmed){delArmed=true;$("delBtn").textContent="Bấm lần nữa để xoá";$("delBtn").className="btn danger";return}
  const id=editing.id;
  try{await removeW(id);works=works.filter(w=>w.id!==id);closeForm();render()}catch(err){$("err").textContent=errMsg(err);$("err").hidden=false}
};
function errMsg(e){
  if(e?.code==="invalid_argument")return"Bạn chỉ có quyền xem, không lưu được thay đổi.";
  if(e?.code==="quota_exceeded")return"Bộ nhớ đã đầy, không lưu được.";
  return"Chưa lưu được. Kiểm tra mạng rồi thử lại.";
}
function flash(m){$("status").textContent=m}

/* ---------- storage ---------- */
async function write(id,patch){
  if(db){await db.collection("works").doc(id).update(patch);return}
  const w=works.find(x=>x.id===id);if(w){Object.assign(w,patch,{steps:{...w.steps,...(patch.steps||{})}})}
  try{localStorage.setItem("p99-works",JSON.stringify(works))}catch(e){}
}
async function removeW(id){
  if(db){await db.collection("works").doc(id).delete();return}
  works=works.filter(w=>w.id!==id);try{localStorage.setItem("p99-works",JSON.stringify(works))}catch(e){}
}

sel=bxToday();render();
setInterval(()=>{if($("overlay").hidden&&tab==="day")render()},60000);

(async()=>{
  try{db=window.claude?.use?await window.claude.use("db"):null}catch(e){db=null}
  if(!db){
    let saved=null;try{saved=JSON.parse(localStorage.getItem("p99-works")||"null")}catch(e){}
    const seed=window.P99_SEED;
    works=saved||(seed?JSON.parse(JSON.stringify(seed.works)):[]);
    days=seed?.days||{};
    $("status").textContent=works.length?"Đã lưu trên thiết bị này":"Không tải được lịch. Mở trang trong ứng dụng Claude khi đã đăng nhập.";
    render();return;
  }
  const timer=setTimeout(()=>{$("status").textContent="Chưa kết nối được dữ liệu, đang thử lại…"},10000);
  db.collection("days").onSnapshot(s=>{days={};s.docs.forEach(d=>days[d.id]=d.data());render()},()=>{});
  db.collection("works").onSnapshot(s=>{
    works=s.docs.map(d=>({id:d.id,...d.data(),steps:{...(d.data().steps||{})}}));
    render();
    if(!s.metadata.fromCache){clearTimeout(timer);$("status").textContent="Đã đồng bộ · giờ hiển thị theo giờ Bỉ";
      if(!loaded){loaded=true;const el=document.querySelector(".day[aria-pressed=true]");if(el)el.scrollIntoView({inline:"center",block:"nearest"})}}
  },()=>{clearTimeout(timer);$("status").textContent="Mất kết nối dữ liệu. Tải lại trang để thử lại."});
})();
</script>

<script>if("serviceWorker" in navigator){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}</script>
</body></html>
